name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features python -- -D warnings
          cargo clippy --all-targets --features 'rayon,wgpu,python' -- -D warnings  # the command the README tells users to run

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash  # a failing command must fail the step on Windows too (PowerShell only reports the last exit code)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # The Python assertion blocks inside the Rust tests are compiled out without the `python` feature.
      - name: Test with the Python feature
        run: cargo test --workspace --no-fail-fast --features python
      # Stack-depth and overflow behavior differs between profiles: the
      # robustness suite caught a release-only stack overflow (batch AR)
      # that the debug runs above cannot see.
      - name: Robustness tests (release profile, Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --test robustness

  # The wheel is built once per OS (the extension is abi3, so one wheel serves every supported Python) and then
  # installed and exercised under each supported Python version below.
  wheel:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install maturin
      - run: maturin build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ci-wheel-${{ matrix.os }}
          path: dist

  wheel-test:
    name: wheel on ${{ matrix.os }}, Python ${{ matrix.python }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # ubuntu-latest is now 26.04, which setup-python has no Python 3.9 for: the wheel jobs are pinned to 24.04
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Not verified that actions/setup-python offers 3.9 for the Apple Silicon runners; remove to try it.
          - os: macos-latest
            python: "3.9"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-wheel-${{ matrix.os }}
          path: dist
      - name: Install the wheel (not the source tree)
        run: python -m pip install numpy && python -m pip install --no-index --find-links dist oxideon
      - name: Tests
        run: |
          python tests/test_python_package.py
          python tests/test_python_ergonomics.py
      - name: Stub freshness
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: |
          python tools/gen_stubs.py
          git diff --exit-code -- python/oxideon
